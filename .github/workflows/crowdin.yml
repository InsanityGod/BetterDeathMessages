name: Update translations

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  translations:
    uses: InsanityGod/InsanityLib/.github/workflows/update-translations.yml@master
    with:
      MOD_LANG_PATH: "BetterDeathMessages/assets/betterdeathmessages/lang"
      TRANSLATION_ZIP: "betterdeathmessages-theinsanitygod.zip"
